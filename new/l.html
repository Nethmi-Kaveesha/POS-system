<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piyara Fashion</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        #name {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .navbar-nav .nav-link {
            color: #333;
            padding: 0.5rem 1rem;
            cursor: pointer; /* Change cursor to pointer for span */
        }

        /* Change color on hover */
        .navbar-nav .nav-link:hover {
            color: #007bff;
        }

        /* Navbar Background Color */
        .navbar {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#" id="name">Piyara Fashion</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <span id="dashboard-nav" class="nav-link">Home</span>
                </li>
                <li class="nav-item">
                    <span id="customer-nav" class="nav-link">Customer Management</span>
                </li>
                <li class="nav-item">
                    <span id="item-nav" class="nav-link">Item Management</span>
                </li>
                <li class="nav-item">
                    <span id="order-nav" class="nav-link">Place Order</span>
                </li>
                <li class="nav-item">
                    <span id="order-history-nav" class="nav-link">Order History</span>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Bootstrap JavaScript (with Popper for toggling) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piyara Fashion - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            position: relative;
        }

        .login-container {
            background: rgba(128, 0, 0, 0.9);
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            margin: auto;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card {
            background-color: #1c1c1c;
            border: none;
            border-radius: 15px;
        }

        .form-control {
            background-color: #2a2a2a;
            color: #ffffff;
            border: 1px solid #b22222;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border: 2px solid #b22222;
            box-shadow: none;
        }

        .btn-primary {
            background-color: #b22222;
            border: none;
            transition: background-color 0.3s;
        }

        .btn-primary:hover {
            background-color: #900000;
        }

        a {
            text-decoration: none;
            color: #ffffff;
        }

        a:hover {
            text-decoration: underline;
            color: #b22222;
        }

        .modal-content {
            background-color: #333333;
            border-radius: 15px;
            color: #ffffff;
        }

        .modal-header {
            border-bottom: none;
        }

        .logo {
            width: 100px;
            margin-bottom: 20px;
        }

        h2 {
            font-weight: bold;
            color: #b22222;
        }

        .image-container {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        .large-image {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: auto;
            object-fit: cover;
            transform: translate(-50%, -50%);
            border-radius: 15px;
            opacity: 0;
            animation: fade 12s infinite;
        }


        @keyframes fade {
            0%, 20% { opacity: 1; }
            25%, 100% { opacity: 0; }
        }

        #image1 {
            animation-delay: 0s;
        }

        #image2 {
            animation-delay: 4s;
        }

        #image3 {
            animation-delay: 8s;
        }

        .footer {
            text-align: center;
            padding: 15px 0;
            color: #ffffff;
            position: absolute;
            bottom: 0;
            width: 100%;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="login-container">
        <div class="card p-4 shadow-lg">
            <div class="card-body text-center">
                <img src="img/images.png" alt="Piyara Fashion Logo" class="logo">
                <h2 class="mb-4">Piyara Fashion Login</h2>

                <form action="index.html" method="POST">
                    <div class="form-group mb-3">
                        <input type="text" name="username" class="form-control rounded-pill" placeholder="Enter your username" required>
                    </div>
                    <div class="form-group mb-3">
                        <input type="password" name="password" class="form-control rounded-pill" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill">Login</button>
                </form>

                <div class="mt-3">
                    <a href="#" class="text-primary">Forgot Password?</a>
                </div>
                <p class="mt-3">Don't have an account? <a href="#" class="text-primary" data-bs-toggle="modal" data-bs-target="#signupModal">Sign Up</a></p>
            </div>
        </div>
    </div>

    <div class="image-container">
        <img src="img/shutterstock_1855048690.jpg" alt="Large Image" class="large-image" id="image1">
        <img src="img/hq720.jpg" alt="Large Image" class="large-image" id="image2">
        <img src="img/different-female-poses.webp" alt="Large Image" class="large-image" id="image3">
    </div>
</div>

<div class="modal fade" id="signupModal" tabindex="-1" aria-labelledby="signupModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="signupModalLabel">Sign Up</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form action="thank-you.html" method="POST">
                    <div class="form-group mb-3">
                        <input type="text" name="signup-username" class="form-control rounded-pill" placeholder="Enter your username" required>
                    </div>
                    <div class="form-group mb-3">
                        <input type="email" name="signup-email" class="form-control rounded-pill" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group mb-3">
                        <input type="password" name="signup-password" class="form-control rounded-pill" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill">Sign Up</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="footer">
    &copy; 2024 Piyara Fashion. All rights reserved.
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piyara Fashion - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #000000; /* Black background */
            font-family: 'Poppins', sans-serif;
            color: #ffffff; /* White text */
            margin: 0;
            overflow: hidden; /* Prevent scrollbars */
        }

        .container {
            display: flex;
            height: 100vh;
            position: relative; /* For absolute positioning of images */
        }

        .login-container {
            background: rgba(128, 0, 0, 0.9); /* Maroon background with transparency */
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            margin: auto; /* Center vertically */
            z-index: 2; /* Ensure login box is above images */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Center content vertically */
        }

        .card {
            background-color: #1c1c1c; /* Dark grey for card */
            border: none;
            border-radius: 15px;
        }

        .form-control {
            background-color: #2a2a2a; /* Darker grey for inputs */
            color: #ffffff; /* White text for inputs */
            border: 1px solid #b22222; /* Maroon border */
            padding: 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border: 2px solid #b22222; /* Maroon focus border */
            box-shadow: none;
        }

        .btn-primary {
            background-color: #b22222; /* Maroon button */
            border: none;
            transition: background-color 0.3s;
        }

        .btn-primary:hover {
            background-color: #900000; /* Darker maroon on hover */
        }

        a {
            text-decoration: none;
            color: #ffffff; /* White links */
        }

        a:hover {
            text-decoration: underline;
            color: #b22222; /* Maroon on hover */
        }

        .modal-content {
            background-color: #333333; /* Dark grey for modal */
            border-radius: 15px;
            color: #ffffff; /* White text */
        }

        .modal-header {
            border-bottom: none;
        }

        .logo {
            width: 100px; /* Logo size */
            margin-bottom: 20px;
        }

        h2 {
            font-weight: bold;
            color: #b22222; /* Maroon for headings */
        }

        .image-container {
            position: relative; /* For absolute positioning of images */
            flex: 1; /* Allow the image container to take available space */
            overflow: hidden; /* Hide overflow for images */
        }

        .large-image {
            position: absolute; /* Position for animation */
            top: 50%;
            left: 50%;
            width: 100%; /* Adjust width to full for better fit */
            height: auto; /* Maintain aspect ratio */
            object-fit: cover; /* Cover the container */
            transform: translate(-50%, -50%); /* Center image */
            border-radius: 15px; /* Rounded corners */
            opacity: 0;
            animation: fade 12s infinite; /* Change duration as needed */
        }

        /* Animation for images */
        @keyframes fade {
            0%, 20% { opacity: 1; } /* Show the image */
            25%, 100% { opacity: 0; } /* Hide the image */
        }

        /* Show each image at different times */
        #image1 {
            animation-delay: 0s; /* First image */
        }

        #image2 {
            animation-delay: 4s; /* Second image */
        }

        #image3 {
            animation-delay: 8s; /* Third image */
        }

        .footer {
            text-align: center;
            padding: 15px 0;
            color: #ffffff;
            position: absolute;
            bottom: 0;
            width: 100%;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="login-container">
        <div class="card p-4 shadow-lg">
            <div class="card-body text-center">
                <img src="img/images.png" alt="Piyara Fashion Logo" class="logo">
                <h2 class="mb-4">Piyara Fashion Login</h2>

                <form action="index.html" method="POST">
                    <div class="form-group mb-3">
                        <input type="text" name="username" class="form-control rounded-pill" placeholder="Enter your username" required>
                    </div>
                    <div class="form-group mb-3">
                        <input type="password" name="password" class="form-control rounded-pill" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill">Login</button>
                </form>

                <div class="mt-3">
                    <a href="#" class="text-primary">Forgot Password?</a>
                </div>
                <p class="mt-3">Don't have an account? <a href="#" class="text-primary" data-bs-toggle="modal" data-bs-target="#signupModal">Sign Up</a></p>
            </div>
        </div>
    </div>

    <div class="image-container">
        <img src="img/shutterstock_1855048690.jpg" alt="Large Image" class="large-image" id="image1">
        <img src="img/hq720.jpg" alt="Large Image" class="large-image" id="image2">
        <img src="img/different-female-poses.webp" alt="Large Image" class="large-image" id="image3">
    </div>
</div>

<div class="modal fade" id="signupModal" tabindex="-1" aria-labelledby="signupModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="signupModalLabel">Sign Up</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form action="thank-you.html" method="POST">
                    <div class="form-group mb-3">
                        <input type="text" name="signup-username" class="form-control rounded-pill" placeholder="Enter your username" required>
                    </div>
                    <div class="form-group mb-3">
                        <input type="email" name="signup-email" class="form-control rounded-pill" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group mb-3">
                        <input type="password" name="signup-password" class="form-control rounded-pill" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill">Sign Up</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="footer">
    &copy; 2024 Piyara Fashion. All rights reserved.
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
